# ==============================================================================
# SEMI-LAGRANGIAN DNS CHANNEL FLOW — Re_tau = 180 (M3 research run)
# ==============================================================================
# MKM-99-style box. The SL scheme has no advective CFL limit; dt is capped by
# physical accuracy: dt+ = dt*u_tau^2/nu <= ~0.4 -> dt_max = 0.4*nu/u_tau^2.
# Here u_tau = Re_tau*nu/delta = 180/5600 -> dt_max ~ 0.069.

grid:
  nx: 192
  ny: 160
  nz: 128

domain:
  Lx: 12.566370614   # 4*pi
  Ly: 4.188790205    # 4*pi/3
  Lz: 2.0

flow:
  Re: 5600.0         # Re = U_bulk*Lz/nu  (Re_b(delta) = 2800, MKM Re_tau~180)
  Re_tau: 180.0
  U_bulk: 1.0
  gamma: 1.8

advection:
  scheme: "sl"       # "sl" | "eulerian"

sl:
  interp_order: 4        # 4 = tricubic, 6 = triquintic
  traj_interp_order: 2   # 2 = trilinear (fast), 4 = tricubic (O(dt^2) studies)
  n_traj_iters: 2
  time_scheme: "v1"      # "v1" (robust, 1st order) | "v2" (2nd order)
  interp_dtype: "fp64"   # "fp64" | "fp32_accum64"

initialization:
  type: "vortices"
  perturbation_intensity: 0.08
  n_vortices: 4

solver:
  type: "fft"

time:
  dt: 0.01
  n_steps: 2000000000
  t_max: 300.0
  CFL_target: 3.0          # TRAJECTORY CFL (SL scheme; the sweep is 1..4)
  dt_update_interval: 10
  dt_max: 0.069            # dt+ ~ 0.4 physical-accuracy cap
  dt_min: 0.0005
  scheme: "IMEX"           # used only when advection.scheme == "eulerian"

compute:
  device: "auto"

output:
  results_folder: results_180_sl
  n_out: 50
  n_save: 2000

statistics:
  enabled: true
  n_stats: 20              # every ~1.4 time units at dt ~ 0.07 (10x fewer
                           # steps than an Eulerian run: cadence set in TIME)
  t_stats: 100.0
  output_file: "turbulence_stats.npz"
  state_file: "turbulence_stats_state.npz"
  z_plus_target: 15.0
