# Continuation of the Re934 M950 rerun: restart from the latest
# checkpoint, keep accumulating the same statistics window.
advection:
  scheme: sl
boundary_conditions:
  top_wall:
    type: dirichlet
compute:
  device: auto
domain:
  Lx: 6.283185307179586
  Ly: 3.141592653589793
  Lz: 2.0
  stretching_type: symmetric
flow:
  Re: 18517.79
  Re_tau: 933.96
  U_bulk: 1.0
  gamma: 2.6
grid:
  nx: 768
  ny: 640
  nz: 320
initialization:
  field_file: results/m950_re934_sl_dt020/fields.npz
  reset_time: false
  type: vortices
output:
  n_out: 50
  n_save: 500
  results_folder: results/m950_re934_sl_dt020
  t_snapshot: 25.0
sl:
  bdf2_pressure: noninc
  interp_dtype: fp32_accum64
  interp_order: 6
  n_traj_iters: 2
  traj_interp_order: 2
solver:
  type: fft
statistics:
  enabled: true
  n_stats: 10
  output_file: turbulence_stats.npz
  restart_state_file: results/m950_re934_sl_dt020/turbulence_stats_state.npz
  spectra_z_planes:
  - 100.0
  - 500.0
  state_file: turbulence_stats_state.npz
  t_stats: 2.2
  z_plus_target: 15.0
time:
  CFL_target: 3.0
  dt: 0.004246
  dt_max: 0.004246
  dt_min: 0.0001
  dt_update_interval: 0
  n_steps: 2000000000
  scheme: IMEX
  t_max: 400.0
