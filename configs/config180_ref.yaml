# ==============================================================================
# EULERIAN REFERENCE (torChannel-identical IMEX) — Re_tau = 180 (M3 baseline)
# ==============================================================================
# Same box/grid as config180_sl.yaml, advanced with the Eulerian IMEX scheme
# (AB2 advection at CFL 0.28) for like-for-like statistics comparison.

grid:
  nx: 192
  ny: 160
  nz: 128

domain:
  Lx: 12.566370614   # 4*pi
  Ly: 4.188790205    # 4*pi/3
  Lz: 2.0

flow:
  Re: 5600.0         # Re = U_bulk*Lz/nu  (Re_b(delta) = 2800, MKM Re_tau~180)
  Re_tau: 180.0
  U_bulk: 1.0
  gamma: 1.8

advection:
  scheme: "eulerian" # "sl" | "eulerian"

sl:
  interp_order: 4        # 4 = tricubic, 6 = triquintic
  traj_interp_order: 2   # 2 = trilinear (fast), 4 = tricubic (O(dt^2) studies)
  n_traj_iters: 2
  time_scheme: "v1"      # "v1" (robust, 1st order) | "v2" (2nd order)
  interp_dtype: "fp64"   # "fp64" | "fp32_accum64"

initialization:
  type: "vortices"
  perturbation_intensity: 0.08
  n_vortices: 4

solver:
  type: "fft"

time:
  dt: 0.01
  n_steps: 2000000000
  t_max: 300.0
  CFL_target: 0.28         # advective CFL (AB2 stability)
  dt_update_interval: 10
  dt_max: 0.02
  dt_min: 0.0005
  scheme: "IMEX"           # used only when advection.scheme == "eulerian"

compute:
  device: "auto"

output:
  results_folder: results_180_ref
  n_out: 50
  n_save: 2000

statistics:
  enabled: true
  n_stats: 200             # every ~1.4 time units at dt ~ 0.007
  t_stats: 100.0
  output_file: "turbulence_stats.npz"
  state_file: "turbulence_stats_state.npz"
  z_plus_target: 15.0
