# ==============================================================================
# M3 SL fp32 — semi-Lagrangian v2 tricubic, CaNS open-channel Re_tau~180 case
# ==============================================================================
# Restart (interpolated, same grid to 1e-8) from the non-actuated CaNS field
# CaNS_DRL/run0_theory_big @ t=68 (converted by scripts/cans_to_npz.py).
# Open channel: no-slip bottom, free-slip top, delta = Lz = 1.
# CaNS reference stats converge over ~100 t.u. from this field (Giorgio).

grid:
  nx: 256
  ny: 256
  nz: 100

domain:
  Lx: 10.68
  Ly: 3.2
  Lz: 1.0
  stretching_type: "bottom"

flow:
  Re: 2870.0          # nu = 1/2870 (CaNS visci)
  Re_tau: 180.0
  U_bulk: 1.0
  gamma: 1.8          # matches the CaNS gtype=2 gr=1.8 grid exactly

boundary_conditions:
  top_wall:
    type: "neumann"   # free-slip top (open channel)

advection:
  scheme: "sl"

initialization:
  type: "interpolate"
  field_file: "data/cans_run0_256x256x100.npz"
  reset_time: true

solver:
  type: "fft"

time:
  dt: 0.005
  n_steps: 2000000000
  t_max: 110.0
  CFL_target: 3.0           # trajectory CFL
  dt_update_interval: 10
  dt_max: 0.034            # dt+ ~ 0.39 physical-accuracy cap
  dt_min: 0.0001
  scheme: "IMEX"

compute:
  device: "auto"

output:
  results_folder: results_180cans_sl_noextrap_full
  n_out: 200
  n_save: 4000

statistics:
  enabled: true
  n_stats: 3
  t_stats: 10.0
  output_file: "turbulence_stats.npz"
  state_file: "turbulence_stats_state.npz"
  z_plus_target: 15.0

sl:
  interp_order: 4
  traj_interp_order: 2
  n_traj_iters: 2
  traj_extrapolation: "none"
  time_scheme: "v2"
  interp_dtype: "fp32_accum64"
