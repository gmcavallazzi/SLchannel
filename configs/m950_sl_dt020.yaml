advection:
  scheme: sl
boundary_conditions:
  top_wall:
    type: dirichlet
compute:
  device: auto
domain:
  Lx: 6.283185307179586
  Ly: 3.141592653589793
  Lz: 2.0
  stretching_type: symmetric
flow:
  Re: 18000.0
  Re_tau: 912.0
  U_bulk: 1.0
  gamma: 2.6
grid:
  nx: 768
  ny: 640
  nz: 320
initialization:
  field_file: results/re395full_sl_dt020/fields_final.npz
  reset_time: true
  type: interpolate
output:
  n_out: 50
  n_save: 500
  results_folder: results/m950_sl_dt020
  t_snapshot: 100.0
sl:
  bdf2_pressure: noninc
  interp_dtype: fp32_accum64
  interp_order: 6
  n_traj_iters: 2
  traj_interp_order: 2
solver:
  type: fft
statistics:
  enabled: true
  n_stats: 10
  output_file: turbulence_stats.npz
  state_file: turbulence_stats_state.npz
  t_stats: 100.0
  z_plus_target: 15.0
time:
  CFL_target: 3.0
  dt: 0.001
  dt_max: 0.0041
  dt_min: 0.0001
  dt_update_interval: 10
  n_steps: 2000000000
  scheme: IMEX
  t_max: 485.0
